name: Pull Request Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  preserved-landing-build:
    name: Build preserved Clawperator landing site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sites/landing-clawperator/package-lock.json
      - run: ./scripts/site_build_clawperator.sh

  commit-message-guard:
    name: Validate Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make validation script executable
        run: chmod +x ./scripts/validate_commit_messages.sh

      - name: Validate commit messages for PR
        if: github.event_name == 'pull_request'
        run: ./scripts/validate_commit_messages.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Validate commit messages for push
        if: github.event_name == 'push'
        run: ./scripts/validate_commit_messages.sh "${{ github.event.before }}" "${{ github.sha }}"

  docs-build:
    name: Build Docs Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"

      - name: Run docs build
        run: ./scripts/docs_build.sh

  android-unit-tests:
    name: Run Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'  # Adjust this version if needed
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./validation/test_all.sh --suite android

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/

  node-tests:
    name: Run Node Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - name: Install Node dependencies
        run: npm --prefix apps/node ci

      - name: Run Node tests
        run: ./validation/test_all.sh --suite node

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-results
          path: |
            apps/node/dist/test/

  eval-tests:
    name: Run Eval Harness Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Run eval harness tests
        run: ./validation/test_all.sh --suite evals

  validation-tests:
    name: Run Validation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - name: Install Node dependencies
        run: npm --prefix apps/node ci

      - name: Install video verification fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run validation suite
        run: ./validation/test_all.sh --suite validation
