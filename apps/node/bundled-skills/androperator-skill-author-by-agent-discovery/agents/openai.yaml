interface:
  display_name: "Skill Author By Agent Discovery"
  short_description: "Choose one truthful next step when no installed skill matches"
  default_prompt: "Use $androperator-skill-author-by-agent-discovery when runtime-skill discovery finds no clear match and you need a truthful first step before recording. Check installed runtime skills for actual goal coverage first, keep discovery bounded to max 5 snapshots, max 3 screenshots, and max 90 seconds, produce one discovery artifact with the required top-level keys (`recommended_next_step`, `existing_skill_verdict`, `target_app_package`, `route_confidence`, `mutation_risk`, `evidence_collected`, `discovery_budget_used`, conditional `skill_classification`, `handoff_target`, and `handoff_reasoning`), record `discovery_budget_used` with `snapshots`, `screenshots`, and `elapsed_wall_time_s`, choose exactly one route (`use_existing_skill`, `proceed_to_orchestrated_authoring`, `proceed_to_recording`, `iterate_discovery`, `one_shot_direct_automation`, `escalate_to_human`, or `decline`), and never author a durable runtime skill directly inside discovery. For explicit orchestrated authoring with sufficient bounded evidence, hand off to $androperator-agent-control-loop after discovery ends. During discovery, capture observable readiness signals that a future skill can poll instead of sleeping. Default to autonomous device driving when the current host can control the device, and ask for human intervention only for real blockers such as sign-in, MFA, CAPTCHA, biometric gates, payment approval, or another explicit human-consent step. When the route is `proceed_to_recording`, hand off to $androperator-skill-author-by-recording with the observed app route, evidence, mutation notes, classification, readiness signals, and any known setup caveats, and steer recording toward the ideal framed `SkillResult` shape with `skillResult.result` (evidence-shaped) first and `skillResult.status` second; prefer nearby exemplar skills that already emit `skillResult.result` when suggesting patterns."
