<title id="title">From pull request to verified UI fix</title>
<desc id="desc">GitHub PR, then your agent and Androperator, then verified. Your agent and Androperator share one outlined panel as the second stage. The agent icons form a triangle: a generic robot above Claude on the left and Codex on the right.</desc>
