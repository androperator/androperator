name: Publish npm Package

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish Node Package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a stable release tag." >&2; exit 1; }

      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js 24.14.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - name: Validate npm supports Trusted Publishing
        run: |
          node - "$(npm --version)" <<'JS'
          const [major, minor, patch] = process.argv[2].split('.').map(Number);
          if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
            throw new Error('Trusted Publishing requires npm 11.5.1 or newer.');
          }
          JS

      - name: Validate tag matches package version
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./apps/node/package.json').name")"
          if [[ "$package_name" != "androperator" ]]; then
            echo "Release publication requires the androperator package name." >&2
            exit 1
          fi

          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./apps/node/package.json').version")"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match apps/node/package.json version $package_version" >&2
            exit 1
          fi

      - name: Validate release changelog
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          python3 - "$version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          if not re.match(r"^\d+\.\d+\.\d+$", version):
              print(f"Error: version '{version}' is not in 0.0.0 format; cannot match CHANGELOG entry.", file=sys.stderr)
              sys.exit(1)

          try:
              content = Path("CHANGELOG.md").read_text(encoding="utf-8")
          except FileNotFoundError:
              print("Error: CHANGELOG.md not found. Run release-notes-author before tagging.", file=sys.stderr)
              sys.exit(1)

          pattern = rf'(##\s*\[{re.escape(version)}\][ \t].*?)(?=\n##\s|\Z)'
          matches = re.findall(pattern, content, re.DOTALL | re.MULTILINE)
          if len(matches) == 0:
              print(f"Error: No CHANGELOG entry found for {version}. Run release-notes-author before tagging.", file=sys.stderr)
              sys.exit(1)
          if len(matches) > 1:
              print(f"Error: Duplicate CHANGELOG entries found for {version}. Fix CHANGELOG.md before tagging.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Install dependencies
        run: npm --prefix apps/node ci

      - name: Build package
        run: npm --prefix apps/node run build

      - name: Test package
        run: npm --prefix apps/node run test

      - name: Pack and validate the release archive
        run: python3 validation/npm-release/pack.py --version "${RELEASE_TAG#v}" --output "$RUNNER_TEMP/androperator-release.tgz"

      - name: Publish package
        working-directory: apps/node
        run: npm publish "$RUNNER_TEMP/androperator-release.tgz" --ignore-scripts=true --access public --tag latest
