name: Launcher drag and drop
on:
  workflow_dispatch:

jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: android-actions/setup-android@v3
      - name: Build branch-local CLI and Operator
        run: |
          npm --prefix apps/node ci
          npm --prefix apps/node run build
          sdkmanager "build-tools;35.0.0"
          ./gradlew :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify launcher move and restoration through accessibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -memory 4096 -gpu swiftshader_indirect -prop persist.sys.locale=en-US
          script: bash validation/drag-drop/ci-device.sh
      - name: Preserve drag and snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-drag-api35
          path: artifacts/drag-drop/
