name: Pull Request Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  androperator-landing-build:
    name: Build Androperator landing site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: |
            sites/landing/package-lock.json
            apps/node/package-lock.json
      - run: ./scripts/site_build.sh

  commit-message-guard:
    name: Validate Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Make validation script executable
        run: chmod +x ./scripts/validate_commit_messages.sh

      - name: Validate commit messages for PR
        if: github.event_name == 'pull_request'
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/validate_commit_messages.sh "$COMMIT_BASE" "$COMMIT_HEAD"

      - name: Validate commit messages for push
        if: github.event_name == 'push'
        env:
          COMMIT_BASE: ${{ github.event.before }}
          COMMIT_HEAD: ${{ github.sha }}
        run: ./scripts/validate_commit_messages.sh "$COMMIT_BASE" "$COMMIT_HEAD"

  docs-build:
    name: Build Docs Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 24.14.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.1"

      - name: Run docs build
        run: ./scripts/docs_build.sh

  android-unit-tests:
    name: Run Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'  # Adjust this version if needed
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./validation/test_all.sh --suite android

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/

  node-tests:
    name: Run Node Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24.14.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - name: Install Node dependencies
        run: npm --prefix apps/node ci

      - name: Run Node tests
        run: ./validation/test_all.sh --suite node

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-test-results
          path: |
            apps/node/dist/test/

  eval-tests:
    name: Run Eval Harness Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Run eval harness tests
        run: ./validation/test_all.sh --suite evals

  validation-tests:
    name: Run Validation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24.14.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - name: Install Node dependencies
        run: npm --prefix apps/node ci

      - name: Install video verification fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run validation suite
        run: ./validation/test_all.sh --suite validation
