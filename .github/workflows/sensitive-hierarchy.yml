name: Sensitive hierarchy access
on:
  workflow_dispatch:

jobs:
  android-15:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Build branch-local CLI and both APK variants
        run: |
          npm --prefix apps/node ci
          npm --prefix apps/node run build
          sdkmanager "build-tools;35.0.0"
          ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Offline assertions and packaged service declarations
        run: |
          node --test apps/node/dist/test/unit/query.test.js apps/node/dist/test/unit/mcpHelpers.test.js apps/node/dist/test/integration/mcp.test.js
          python3 -m unittest discover -s validation/sensitive-hierarchy-access -p 'test_*.py'
          python3 validation/sensitive-hierarchy-access/check-apk.py --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" apps/android/app/build/outputs/apk/debug/app-debug.apk apps/android/app/build/outputs/apk/release/app-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 Settings regression for both variants
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -prop persist.sys.locale=en-US
          script: bash validation/sensitive-hierarchy-access/ci-device.sh
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sensitive-hierarchy-api35
          path: artifacts/sensitive-hierarchy/
